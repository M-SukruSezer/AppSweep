<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128"
     viewBox="0 0 128 128">
  <title>AppSweep</title>
  <!--
    Keep the <svg> element within the first bytes of the file. gdk-pixbuf
    identifies an image by sniffing its opening bytes, and a long comment
    above the element pushes <svg> out of that window: the loader then
    reports "couldn't recognize the image file format" and the desktop
    shows no icon at all, even though GTK's own icon theme resolves the
    file perfectly well. That is why this explanation sits here instead.

    One idea, which is the reason this app exists: the application has
    been lifted away, and the shape it occupied is still there. The dashed
    outline is the footprint — the settings, caches and data a package
    manager leaves behind — and the specks inside it are what is actually
    left lying in it.

    Adwaita template: 128x128, GNOME palette, flat shapes with an offset
    darker layer for thickness.
  -->

  <g transform="translate(64 64) scale(0.94) translate(-64 -64)">
    <!-- what the application left behind -->
    <g transform="rotate(-5 48 82)">
      <rect x="8" y="42" width="80" height="80" rx="22"
            fill="none" stroke="#c0bfbc" stroke-width="10"
            stroke-dasharray="18 13" stroke-linecap="round"/>
      <circle cx="30" cy="94" r="5.5" fill="#9a9996"/>
      <circle cx="46" cy="104" r="4" fill="#9a9996"/>
      <circle cx="22" cy="110" r="3.2" fill="#9a9996"/>
    </g>

    <!-- the application, lifted clear -->
    <g transform="rotate(7 84 50)">
      <rect x="44" y="12" width="80" height="80" rx="22" fill="#1a5fb4"/>
      <rect x="44" y="6" width="80" height="80" rx="22" fill="#3584e4"/>
      <rect x="58" y="19" width="38" height="9" rx="4.5" fill="#99c1f1"/>
    </g>
  </g>
</svg>
