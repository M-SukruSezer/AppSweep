<?xml version="1.0" encoding="UTF-8"?>
<!--
  AppSweep — application icon.

  One idea, which is the reason this app exists: the application has been
  lifted away, and the shape it occupied is still there. The dashed outline
  is the footprint — the settings, caches and data a package manager leaves
  behind — and the specks inside it are what is actually left lying in it.

  Earlier drafts drew a brush. A brush says "cleaning utility"; it does not
  say "this is about software". A tile plus the hole it left says both, and
  it survives being drawn at 32 pixels, which a brush did not.

  Adwaita template: 128x128, GNOME palette, flat shapes with an offset
  darker layer for thickness. Ink coverage is about 53% against the ~63%
  of org.gnome.baobab and Settings; the gap is the hollow footprint, and
  filling it would cost the icon its meaning.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128"
     viewBox="0 0 128 128">
  <title>AppSweep</title>

  <g transform="translate(64 64) scale(0.94) translate(-64 -64)">
    <!-- what the application left behind -->
    <g transform="rotate(-5 48 82)">
      <rect x="8" y="42" width="80" height="80" rx="22"
            fill="none" stroke="#c0bfbc" stroke-width="10"
            stroke-dasharray="18 13" stroke-linecap="round"/>
      <circle cx="30" cy="94" r="5.5" fill="#9a9996"/>
      <circle cx="46" cy="104" r="4" fill="#9a9996"/>
      <circle cx="22" cy="110" r="3.2" fill="#9a9996"/>
    </g>

    <!-- the application, lifted clear -->
    <g transform="rotate(7 84 50)">
      <rect x="44" y="12" width="80" height="80" rx="22" fill="#1a5fb4"/>
      <rect x="44" y="6" width="80" height="80" rx="22" fill="#3584e4"/>
      <rect x="58" y="19" width="38" height="9" rx="4.5" fill="#99c1f1"/>
    </g>
  </g>
</svg>
