<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
     viewBox="0 0 16 16">
  <title>AppSweep</title>
  <!--
    The <svg> element stays at the top of the file on purpose; see
    the full-colour icon for why. gdk-pixbuf will not recognise an
    SVG whose opening tag is pushed down by a comment.

    The same idea at 16px: the application lifted clear, and the
    outline of what it left behind. The footprint is a filled path
    with a hole rather than a stroked rectangle, because GTK renders
    a symbolic icon as a mask and fills strokes in.
  -->

  <!-- what it left behind -->
  <path fill="currentColor" fill-rule="evenodd"
        d="M3.50,6.60 H7.50 A2.50,2.50 0 0 1 10.00,9.10 V12.80 A2.50,2.50 0 0 1 7.50,15.30 H3.50 A2.50,2.50 0 0 1 1.00,12.80 V9.10 A2.50,2.50 0 0 1 3.50,6.60 Z M3.91,7.95 H7.10 A1.56,1.56 0 0 1 8.65,9.50 V12.39 A1.56,1.56 0 0 1 7.10,13.95 H3.91 A1.56,1.56 0 0 1 2.35,12.39 V9.50 A1.56,1.56 0 0 1 3.91,7.95 Z"/>
  <!-- the application, lifted clear -->
  <path fill="currentColor" d="M10.70,0.80 H13.40 A1.90,1.90 0 0 1 15.30,2.70 V5.40 A1.90,1.90 0 0 1 13.40,7.30 H10.70 A1.90,1.90 0 0 1 8.80,5.40 V2.70 A1.90,1.90 0 0 1 10.70,0.80 Z"/>
</svg>
